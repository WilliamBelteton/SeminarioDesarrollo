<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Educativo UMG</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (opcional pero recomendado) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Estilos base para el Layout de Sidebar de Bootstrap */
        body,
        html {
            height: 100%;
            overflow: hidden;
            /* Evita scroll en todo el body, lo delegamos a las secciones */
        }

        main {
            height: 100vh;
            display: flex;
            flex-wrap: nowrap;
        }

        .sidebar {
            width: 280px;
            overflow-y: auto;
        }

        .content-area {
            flex-grow: 1;
            overflow-y: auto;
            background-color: #f8f9fa;
        }

        /* Ajuste para que la imagen de la tarjeta cubra bien el espacio */
        .card-img-top {
            height: 180px;
            object-fit: cover;
            background-color: #e9ecef;
        }

        /* Descripción truncada en las cards */
        .text-truncate-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Respuestas anidadas */
        .respuesta-container {
            border-left: 2px solid #dee2e6;
            padding-left: 1rem;
            margin-left: 1rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>

    <main>
        <!-- ================= SIDEBAR ================= -->
        <div class="sidebar d-flex flex-column flex-shrink-0 p-3 bg-body-tertiary border-end">
            <a href="#"
                class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
                <i class="bi bi-play-circle-fill fs-3 text-primary me-2"></i>
                <span class="fs-4 fw-bold text-primary">Videos Seminario UMG</span>
            </a>
            <hr>

            <h6
                class="sidebar-heading d-flex justify-content-between align-items-center px-2 mt-2 mb-2 text-body-secondary text-uppercase">
                <span>Categorías</span>
            </h6>
            <ul class="nav nav-pills flex-column mb-auto gap-1" id="categoriasContenedor">
                <!-- Se llenará dinámicamente -->
            </ul>

            <hr>

            <!-- Panel Visitante (Botones Login/Registro) -->
            <div id="authPanel" class="d-grid gap-2">
                <button class="btn btn-outline-primary" onclick="mostrarModal('loginModal')">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                </button>
                <button class="btn btn-primary" onclick="mostrarModal('registroModal')">
                    <i class="bi bi-person-plus"></i> Registrarse
                </button>
            </div>

            <!-- Panel Usuario Logueado (Dropdown Bootstrap) -->
            <div id="userPanel" class="dropdown" style="display: none;">
                <a href="#" class="d-flex align-items-center link-body-emphasis text-decoration-none dropdown-toggle"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle fs-4 me-2 text-primary"></i>
                    <strong id="userNameDisplay" class="text-truncate" style="max-width: 180px;">Usuario</strong>
                </a>
                <ul class="dropdown-menu text-small shadow">
                    <li>
                        <h6 class="dropdown-header">Mi Cuenta</h6>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item text-danger" href="#" onclick="cerrarSesion()">
                            <i class="bi bi-box-arrow-left"></i> Cerrar Sesión
                        </a></li>
                </ul>
            </div>
        </div>

        <!-- ================= CONTENIDO PRINCIPAL ================= -->
        <div class="content-area p-4 p-md-5">
            <!-- Buscador -->
            <div class="row mb-4">
                <div class="col-md-8 col-lg-6 mx-auto">
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control border-start-0" id="searchInput"
                            placeholder="Buscar video por título...">
                    </div>
                </div>
            </div>

            <!-- Galería de Videos -->
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 row-cols-xl-4 g-4" id="galeriaVideos">
                <!-- Se llenará dinámicamente -->
            </div>
        </div>
    </main>

    <!-- ================= MODALES DE BOOTSTRAP ================= -->

    <!-- Modal Registro -->
    <div class="modal fade" id="registroModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Registro de Estudiante</h5>
                    <button type="button" class="btn-close" onclick="cerrarModal('registroModal')"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Carné Universitario</label>
                        <input type="text" class="form-control" id="regCarne" placeholder="9999-99-99999">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Nombre Completo</label>
                        <input type="text" class="form-control" id="regNombre" placeholder="Tu nombre">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Correo Electrónico</label>
                        <input type="email" class="form-control" id="regCorreo" placeholder="usuario@correo.com">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small">PIN de Seguridad (Contraseña)</label>
                        <input type="password" class="form-control" id="regPassword" placeholder="Solo números">
                    </div>
                    <button class="btn btn-primary w-100" onclick="registrarEstudiante()">Registrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Login -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Iniciar Sesión</h5>
                    <button type="button" class="btn-close" onclick="cerrarModal('loginModal')"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Carné o Correo</label>
                        <input type="text" class="form-control" id="loginUsuario" placeholder="9999-99-99999 o correo">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small">PIN Numérico</label>
                        <input type="password" class="form-control" id="loginPassword" placeholder="Tu PIN">
                    </div>
                    <button class="btn btn-primary w-100" onclick="iniciarSesion()">Ingresar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Detalle de Video -->
    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content bg-light">
                <div class="modal-header bg-white">
                    <h5 class="modal-title fw-bold" id="videoModalTitle">Detalle de Video</h5>
                    <button type="button" class="btn-close" onclick="cerrarModal('videoModal')"></button>
                </div>
                <div class="modal-body p-0" id="videoDetalleContenedor">
                    <!-- Se llena al hacer clic en un video -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE = 'https://back-semprivado-umg-h6fkf2bng2avgrgw.westus3-01.azurewebsites.net';
        let usuarioActual = JSON.parse(localStorage.getItem('usuarioEduVids')) || null;
        let videosCatalogo = [];
        let videoSeleccionadoId = null;

        // Variables globales para modales Bootstrap
        let modalRegistro, modalLogin, modalVideo;

        document.addEventListener('DOMContentLoaded', () => {
            // Inicializar instancias de modales
            modalRegistro = new bootstrap.Modal(document.getElementById('registroModal'));
            modalLogin = new bootstrap.Modal(document.getElementById('loginModal'));
            modalVideo = new bootstrap.Modal(document.getElementById('videoModal'));

            verificarSesion();
            cargarCategorias();
            cargarVideosCompletos();

            document.getElementById('searchInput').addEventListener('input', (e) => {
                const termino = e.target.value.toLowerCase();
                const filtrados = videosCatalogo.filter(v => v.titulo.toLowerCase().includes(termino));
                renderizarVideos(filtrados);
            });
        });

        // Funciones auxiliares Modales
        function mostrarModal(id) {
            if (id === 'registroModal') modalRegistro.show();
            if (id === 'loginModal') modalLogin.show();
            if (id === 'videoModal') modalVideo.show();
        }
        function cerrarModal(id) {
            if (id === 'registroModal') modalRegistro.hide();
            if (id === 'loginModal') modalLogin.hide();
            if (id === 'videoModal') {
                modalVideo.hide();
                videoSeleccionadoId = null;
            }
        }

        // ================= SERIE I: AUTENTICACIÓN =================
        async function registrarEstudiante() {
            const carne = document.getElementById('regCarne').value.trim();
            const estudiante = document.getElementById('regNombre').value.trim();
            const correo = document.getElementById('regCorreo').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!/^\d{4}-\d{2}-\d{5}$/.test(carne)) return alert("El carné debe tener el formato 9999-99-99999");
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) return alert("Correo inválido");
            if (!/^\d+$/.test(password)) return alert("La contraseña debe ser un PIN estrictamente numérico");

            try {
                const res = await fetch(`${API_BASE}/api/estudiantes/registrar`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ carne, estudiante, correo, password })
                });
                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(`Error del servidor: ${errorText}`);
                }
                alert("Registro exitoso. Ahora puedes iniciar sesión.");
                cerrarModal('registroModal');
                mostrarModal('loginModal'); // Abre login tras registro exitoso
            } catch (err) { alert(err.message); }
        }

        function buscarTextoEnObjeto(obj, clavesPosibles) {
            if (!obj || typeof obj !== 'object') return null;
            for (let key of Object.keys(obj)) {
                if (clavesPosibles.includes(key.toLowerCase())) {
                    if (typeof obj[key] === 'string' || typeof obj[key] === 'number') return obj[key];
                }
            }
            for (let key of Object.keys(obj)) {
                if (typeof obj[key] === 'object' && obj[key] !== null) {
                    let resultado = buscarTextoEnObjeto(obj[key], clavesPosibles);
                    if (resultado) return resultado;
                }
            }
            return null;
        }

        async function iniciarSesion() {
            const usuarioInput = document.getElementById('loginUsuario').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            try {
                const res = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuarioInput, password })
                });

                const responseText = await res.text();
                if (!res.ok) throw new Error(`Credenciales incorrectas`);

                let userData = null;
                try { userData = JSON.parse(responseText); } catch (e) { }

                let carneServidor = buscarTextoEnObjeto(userData, ['carne', 'carné', 'carnet', 'id']);
                let nombreServidor = buscarTextoEnObjeto(userData, ['estudiante', 'nombre', 'usuario', 'name']);

                const esFormatoCarne = /^\d{4}-\d{2}-\d{5}$/.test(usuarioInput);
                let carneFinal = carneServidor || (esFormatoCarne ? usuarioInput : null);

                if (!carneFinal) {
                    alert("Aviso: Ingresaste con correo, pero el sistema no pudo encontrar tu carné. Las interacciones podrían fallar.");
                }

                usuarioActual = {
                    carne: carneFinal || usuarioInput,
                    nombre: nombreServidor || carneFinal || usuarioInput
                };

                localStorage.setItem('usuario', JSON.stringify(usuarioActual));
                verificarSesion();
                cerrarModal('loginModal');
                if (videoSeleccionadoId) abrirVideo(videoSeleccionadoId); // Recarga si había video abierto

            } catch (err) { alert("Error al iniciar sesión: " + err.message); }
        }

        function verificarSesion() {
            if (usuarioActual && usuarioActual.carne) {
                document.getElementById('authPanel').style.display = 'none';
                document.getElementById('userPanel').style.display = 'block';
                document.getElementById('userNameDisplay').innerText = usuarioActual.nombre;
            } else {
                document.getElementById('authPanel').style.display = 'grid';
                document.getElementById('userPanel').style.display = 'none';
            }
        }

        function cerrarSesion() {
            usuarioActual = null;
            localStorage.removeItem('usuario');
            verificarSesion();
            if (videoSeleccionadoId) abrirVideo(videoSeleccionadoId);
        }

        // ================= SERIE II: CATÁLOGO =================
        async function cargarCategorias() {
            try {
                const res = await fetch(`${API_BASE}/api/videos/categorias`);
                const categorias = await res.json();
                const contenedor = document.getElementById('categoriasContenedor');
                let html = `
                    <li class="nav-item">
                        <a href="#" class="nav-link active" onclick="filtrarPorCategoria('ALL', this)"><i class="bi bi-grid-fill me-2"></i>Todo</a>
                    </li>`;

                categorias.forEach(cat => {
                    const nombreCat = typeof cat === 'string' ? cat : cat.nombre;
                    html += `
                    <li class="nav-item">
                        <a href="#" class="nav-link text-body-secondary" onclick="filtrarPorCategoria('${nombreCat}', this)"><i class="bi bi-tag me-2"></i>${nombreCat}</a>
                    </li>`;
                });
                contenedor.innerHTML = html;
            } catch (err) { }
        }

        async function cargarVideosCompletos() {
            try {
                const res = await fetch(`${API_BASE}/api/videos`);
                videosCatalogo = await res.json();
                renderizarVideos(videosCatalogo);
            } catch (err) { }
        }

        async function filtrarPorCategoria(categoria, botonElement) {
            document.querySelectorAll('#categoriasContenedor .nav-link').forEach(btn => {
                btn.classList.remove('active');
                btn.classList.add('text-body-secondary');
            });
            botonElement.classList.remove('text-body-secondary');
            botonElement.classList.add('active');

            if (categoria === 'ALL') return cargarVideosCompletos();
            try {
                const res = await fetch(`${API_BASE}/api/videos/categoria/${encodeURIComponent(categoria)}`);
                const filtrados = await res.json();
                renderizarVideos(filtrados);
            } catch (err) { }
        }

        function renderizarVideos(videos) {
            const contenedor = document.getElementById('galeriaVideos');
            if (videos.length === 0) return contenedor.innerHTML = '<div class="col-12"><div class="alert alert-info">No se encontraron videos.</div></div>';

            contenedor.innerHTML = videos.map(v => {
                const idVideo = v.id || v.videoId;
                return `
                <div class="col">
                    <div class="card h-100 shadow-sm border-0" role="button" onclick="abrirVideo('${idVideo}')">
                        <img src="${v.poster || 'https://via.placeholder.com/300x160?text=Video'}" class="card-img-top" alt="Poster">
                        <div class="card-body">
                            <h6 class="card-title fw-bold">${v.titulo || 'Sin Título'}</h6>
                            <p class="card-text text-muted small text-truncate-2">${v.descripcion || ''}</p>
                        </div>
                        <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center">
                            <small class="text-primary fw-semibold"><i class="bi bi-play-fill"></i> Ver Ahora</small>
                            <span class="badge text-bg-light text-muted border"><i class="bi bi-heart-fill text-danger"></i> ${v.likes || 0}</span>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        // ================= SERIE III: INTERACCIÓN Y COMENTARIOS =================
        async function abrirVideo(id) {
            videoSeleccionadoId = id;
            try {
                const res = await fetch(`${API_BASE}/api/videos/${id}`);
                if (!res.ok) throw new Error("No se pudo obtener el detalle.");
                const video = await res.json();
                renderizarDetalleVideo(video, id);
                mostrarModal('videoModal');
            } catch (err) { alert(err.message); }
        }

        function renderizarDetalleVideo(video, idExtraido) {
            const cont = document.getElementById('videoDetalleContenedor');
            document.getElementById('videoModalTitle').innerText = video.titulo || 'Video';

            const isLogueado = usuarioActual !== null;
            const idActual = video.id || video.videoId || idExtraido;

            let html = `
                <!-- Reproductor -->
                <div class="bg-dark d-flex justify-content-center align-items-center" style="height: 450px;">
                    <img src="${video.poster || 'https://via.placeholder.com/800x450?text=Reproductor+de+Video'}" style="max-height:100%; max-width:100%; object-fit:contain;" alt="Reproductor">
                </div>
                
                <div class="p-4 bg-white">
                    <!-- Info e Interacción -->
                    <div class="d-flex justify-content-between align-items-start mb-4 pb-3 border-bottom">
                        <div class="me-3">
                            <h4 class="fw-bold mb-2">${video.titulo || 'Sin Título'}</h4>
                            <p class="text-secondary mb-0">${video.descripcion || 'Sin descripción'}</p>
                        </div>
                        <button class="btn btn-${isLogueado ? 'primary' : 'outline-primary'} flex-shrink-0 shadow-sm" onclick="manejarLike('${idActual}')">
                            <i class="bi bi-hand-thumbs-up-fill me-1"></i> Me Gusta <span class="badge text-bg-light ms-1">${video.likes || 0}</span>
                        </button>
                    </div>

                    <!-- Sección Comentarios -->
                    <div class="mt-4">
                        <h5 class="fw-bold mb-3"><i class="bi bi-chat-text me-2"></i> Comentarios</h5>
            `;

            if (isLogueado) {
                html += `
                    <div class="d-flex gap-2 mb-4">
                        <input type="text" class="form-control bg-light" id="nuevoComentario" placeholder="Escribe un comentario público...">
                        <button class="btn btn-primary px-4" onclick="publicarComentarioPrincipal('${idActual}')"><i class="bi bi-send-fill"></i></button>
                    </div>
                `;
            } else {
                html += `<div class="alert alert-warning py-2 mb-4"><i class="bi bi-info-circle me-2"></i> Inicia sesión para interactuar (Me gusta / Comentar).</div>`;
            }

            const comentarios = video.comentarios || [];
            if (comentarios.length === 0) {
                html += `<p class="text-muted fst-italic">No hay comentarios aún. ¡Sé el primero!</p>`;
            }

            comentarios.forEach(com => {
                const idComentario = com.id || com.comentarioId;
                const esMiComentario = isLogueado && com.carne === usuarioActual.carne;
                html += `
                    <div class="card border-0 bg-light mb-3 shadow-sm">
                        <div class="card-body py-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <strong class="text-dark"><i class="bi bi-person-circle text-secondary me-2"></i>${com.carne || 'Usuario'}</strong>
                                ${esMiComentario ? `<button class="btn btn-sm btn-link text-danger p-0 text-decoration-none" onclick="eliminarComentario('${idComentario}')"><i class="bi bi-trash3"></i> Eliminar</button>` : ''}
                            </div>
                            <p class="mb-2 text-dark">${com.texto}</p>
                            
                            ${isLogueado ? `
                                <div>
                                    <button class="btn btn-sm btn-outline-secondary py-0" onclick="mostrarCajaRespuesta('${idComentario}')"><i class="bi bi-reply-fill"></i> Responder</button>
                                    <div id="caja-respuesta-${idComentario}" class="d-flex gap-2 mt-2" style="display:none !important;">
                                        <input type="text" class="form-control form-control-sm" id="texto-respuesta-${idComentario}" placeholder="Escribe tu respuesta...">
                                        <button class="btn btn-sm btn-primary" onclick="responderComentario('${idComentario}')">Enviar</button>
                                    </div>
                                </div>
                            ` : ''}

                            <!-- Respuestas -->
                            <div class="respuesta-container">
                                ${(com.respuestas || []).map(resp => `
                                    <div class="bg-white p-2 rounded shadow-sm border mb-2">
                                        <div class="d-flex justify-content-between align-items-center mb-1">
                                            <small class="fw-bold"><i class="bi bi-arrow-return-right text-muted me-1"></i> ${resp.carne}</small>${(isLogueado && resp.carne === usuarioActual.carne) ? `<button class="btn btn-sm btn-link text-danger p-0 text-decoration-none" onclick="eliminarComentario('${resp.id || resp.comentarioId}')"><i class="bi bi-trash3"></i></button>` : ''}
                                        </div>
                                        <small class="text-dark d-block">${resp.texto}</small>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            cont.innerHTML = html;
        }

        async function manejarLike(videoId) {
            if (!usuarioActual) {
                cerrarModal('videoModal');
                mostrarModal('loginModal');
                return alert("Debes iniciar sesión para dar Like.");
            }
            try {
                const res = await fetch(`${API_BASE}/api/interaccionvideo/${videoId}/like`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ carne: usuarioActual.carne })
                });
                if (!res.ok) throw new Error("Error al procesar el Like.");
                abrirVideo(videoId);
            } catch (err) { alert(err.message); }
        }

        async function publicarComentarioPrincipal(videoId) {
            const input = document.getElementById('nuevoComentario');
            const texto = input.value.trim();
            if (!texto) return;
            try {
                const res = await fetch(`${API_BASE}/api/interaccionvideo/${videoId}/comentario`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ carne: usuarioActual.carne, texto: texto })
                });
                if (!res.ok) throw new Error("Error publicando comentario.");
                input.value = '';
                abrirVideo(videoId);
            } catch (err) { alert(err.message); }
        }

        function mostrarCajaRespuesta(comentarioId) {
            const caja = document.getElementById(`caja-respuesta-${comentarioId}`);
            // Usamos removeProperty/setProperty porque Bootstrap sobreescribe 'd-flex' con 'display: flex!important'
            if (caja.style.getPropertyValue('display') === 'none') {
                caja.style.setProperty('display', 'flex', 'important');
            } else {
                caja.style.setProperty('display', 'none', 'important');
            }
        }

        async function responderComentario(comentarioId) {
            const input = document.getElementById(`texto-respuesta-${comentarioId}`);
            const texto = input.value.trim();
            if (!texto) return;
            try {
                const res = await fetch(`${API_BASE}/api/interaccionvideo/comentario/${comentarioId}/responder`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ carne: usuarioActual.carne, texto: texto })
                });
                if (!res.ok) throw new Error("Error enviando la respuesta.");
                abrirVideo(videoSeleccionadoId);
            } catch (err) { alert(err.message); }
        }

        async function eliminarComentario(comentarioId) {
            if (!confirm("¿Seguro que deseas eliminar este comentario?")) return;
            try {
                const res = await fetch(`${API_BASE}/api/interaccionvideo/comentario/${comentarioId}?carne=${usuarioActual.carne}`, {
                    method: 'DELETE'
                });
                if (res.status === 403) alert("Acceso denegado: Solo puedes eliminar tus propios comentarios.");
                else if (!res.ok) throw new Error("Error al eliminar el comentario.");
                else abrirVideo(videoSeleccionadoId);
            } catch (err) { alert(err.message); }
        }
    </script>
